# ---- Database (change with environment variables, or edit here) ----
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/safety_companion}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Hibernate creates/updates the tables from the model classes (fine for this project)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

server.port=8080

# ---- App settings ----
# How long a traveler's 6-digit pairing code works
app.pairing.code-minutes=10
# Creates a demo family + demo trip on start (email demo@cs152.dev, password demo1234)
app.seed-demo-data=true
